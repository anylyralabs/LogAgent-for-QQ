name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build LogAgent.slnx -v q
      - name: Test
        run: dotnet test tests/LogAgent.Tests/LogAgent.Tests.csproj --nologo
